# config/sensor_specs.yaml
# Datasheet-sourced technical ranges and declared uncertainty per raw channel.
#
# Verified directly against the official manufacturer datasheets (2026-07-24,
# not secondhand): Sensirion SPS30 Datasheet v2.0 D1 (June 2023), Sensirion
# SCD4x Datasheet v1.7 (April 2025), Bosch BME688 Datasheet Rev.1.3
# BST-BME688-DS000-03 (February 2024). The manuscript itself cites these
# datasheets only by name [13]-[15] with no page numbers -- exact page/table
# citations below are from this project's own verification against the
# current public datasheet revisions; confirm they match the exact revision
# used for your physical sensor units before publication.
#
# Real-world accuracy specs are value-dependent formulas (e.g. SPS30:
# +/-[5 ug/m3 + 5% of reading] for PM1/PM2.5 at 0-100 ug/m3); declared_uncertainty
# below is a single representative constant chosen for this deployment's
# typical operating range (see each entry's comment), since the config model
# only supports a flat number. declared_uncertainty is used as the minimum
# required membership-function overlap (transition) width for that channel,
# the stability-analysis perturbation magnitude, the dual-channel
# confirmation tolerance, and the gradual-drift magnitude gate.
channels:
  co2:
    min: 400
    max: 40000
    unit: ppm
    source: "Sensirion SCD4x Datasheet v1.7 (April 2025), Table 1 p.3: CO2 output range 0-40'000 ppm (sensor's full reportable range); SCD41 accuracy specified only for 400-5'000 ppm"
    # SCD41 accuracy: +/-(50 ppm + 2.5% of reading) for 400-1'000 ppm,
    # +/-(50 ppm + 3%) for 1'001-2'000 ppm, +/-(40 ppm + 5%) for 2'001-5'000 ppm.
    # This deployment's typical indoor range is ~600-900 ppm (400-1'000 band);
    # representative value at ~800 ppm: 50 + 2.5%*800 = 70 ppm.
    declared_uncertainty: 70.0
  scd_temp:
    min: -10
    max: 60
    unit: "degC"
    source: "Sensirion SCD4x Datasheet v1.7 (April 2025), Table 3 p.3: temperature range -10 to 60 degC, accuracy +/-0.8 degC typ. (15-35 degC band, the relevant indoor range)"
    declared_uncertainty: 0.8
  scd_humidity:
    min: 0
    max: 100
    unit: "%"
    source: "Sensirion SCD4x Datasheet v1.7 (April 2025), Table 2 p.3: humidity range 0-100% RH, accuracy +/-6% RH typ. (15-35 degC, 20-65% RH band, the relevant indoor range)"
    declared_uncertainty: 6.0
  bme_temp:
    min: -40
    max: 85
    unit: "degC"
    source: "Bosch BME688 Datasheet Rev.1.3 BST-BME688-DS000-03 (Feb 2024), Table 10 p.14: operating range -40 to 85 degC, absolute accuracy +/-0.5 degC (0-65 degC full-accuracy range)"
    declared_uncertainty: 0.5
  bme_humidity:
    min: 0
    max: 100
    unit: "%"
    source: "Bosch BME688 Datasheet Rev.1.3 BST-BME688-DS000-03 (Feb 2024), Table 8 p.12: range 0-100% RH, absolute accuracy +/-3% RH (20-80% RH, 25 degC, incl. hysteresis)"
    declared_uncertainty: 3.0
  pressure:
    min: 300
    max: 1100
    unit: hPa
    source: "Bosch BME688 Datasheet Rev.1.3 BST-BME688-DS000-03 (Feb 2024), Table 9 p.13: operating pressure range (full accuracy) 300-1'100 hPa, absolute accuracy +/-0.6 hPa (300-1'100 hPa, 0-65 degC)"
    declared_uncertainty: 0.6
  pm_mass_fine:
    # PM1.0 and PM2.5 -- the SPS30 datasheet groups these two channels
    # together with the same precision spec, distinct from PM4/PM10 below.
    min: 0
    max: 1000
    unit: "ug/m3"
    source: "Sensirion SPS30 Datasheet v2.0 D1 (June 2023), Table 1 p.2: mass concentration range 0-1'000 ug/m3, PM1/PM2.5 precision +/-[5 ug/m3 + 5% of reading] (0-100 ug/m3 band, the relevant indoor range)"
    declared_uncertainty: 5.0
  pm_mass_coarse:
    # PM4.0 and PM10 -- the SPS30 datasheet specifies a materially larger
    # uncertainty for these two channels (5x the fine-particle figure at low
    # concentrations) since they are derived from the same distribution fit,
    # not measured as directly. This was previously (incorrectly) using the
    # PM1/PM2.5 figure for PM10 too -- fixed 2026-07-24.
    min: 0
    max: 1000
    unit: "ug/m3"
    source: "Sensirion SPS30 Datasheet v2.0 D1 (June 2023), Table 1 p.2: mass concentration range 0-1'000 ug/m3, PM4/PM10 precision +/-25 ug/m3 (0-100 ug/m3 band, the relevant indoor range)"
    declared_uncertainty: 25.0
  pm_number:
    min: 0
    max: 3000
    unit: "#/cm3"
    source: "Sensirion SPS30 Datasheet v2.0 D1 (June 2023), Table 1 p.2: number concentration range 0-3'000 #/cm3, PM0.5/PM1/PM2.5 precision +/-100 #/cm3 (0-1'000 #/cm3 band); not currently mapped to any validation logic (auxiliary channel only)"
    declared_uncertainty: 100.0
