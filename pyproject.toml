[project]
name = "iaq-hfis"
version = "0.1.0"
description = "Hierarchical fuzzy indoor air quality index (HFIS) — supporting implementation for the Borodii & Osukhivska manuscript."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "PyYAML>=6.0.1",
    "pydantic>=2.0.0",
    "jsonschema>=4.0.0",
    "matplotlib>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
